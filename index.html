<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ggg — 3D Adventure</title><style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:white;font:16px system-ui;overflow:hidden;touch-action:none}canvas{display:block}#hud{position:absolute;top:12px;left:12px;background:#101820dd;padding:14px;border-radius:12px;pointer-events:none}#hp{width:180px;height:10px;background:#542c32;border-radius:5px;overflow:hidden}#bar{height:100%;background:#58d68d}#msg{position:absolute;top:12px;right:12px;background:#101820dd;padding:12px;max-width:40%;border-radius:10px}#controls{position:absolute;bottom:20px;left:20px;display:grid;grid-template-columns:repeat(3,58px);gap:6px}button{background:#263b4de8;color:white;border:1px solid #8295a6;border-radius:12px;font: bold 20px system-ui;min-height:54px;touch-action:none}#attack{position:absolute;right:20px;bottom:25px;width:92px;height:76px}#reset{position:absolute;right:20px;bottom:115px;font-size:14px;padding:8px}#error{position:absolute;inset:0;display:none;place-items:center;background:#101820;padding:30px;text-align:center}
</style></head><body><div id="hud"><b>GGG · 3D ADVENTURE</b><p id="stats"></p><div id="hp"><div id="bar"></div></div><p id="quest"></p><small>WASD / ↑↓←→ · Space: hujum</small></div><div id="msg">5 ta maxluqni yenging. Oltinlarni yig‘ing.</div><div id="controls"><span></span><button data-key="w">↑</button><span></span><button data-key="a">←</button><button data-key="s">↓</button><button data-key="d">→</button></div><button id="attack">⚔</button><button id="reset">Qayta boshlash</button><div id="error"></div><script type="module">
try {
const T=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
const scene=new T.Scene();scene.background=new T.Color(0x9ab9ce);scene.fog=new T.Fog(0x9ab9ce,45,115);
const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,180);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x556644,2));const sun=new T.DirectionalLight(0xffe3b5,2);sun.position.set(20,35,10);scene.add(sun);
function mesh(g,c,x,y,z){const m=new T.Mesh(g,new T.MeshStandardMaterial({color:c}));m.position.set(x,y,z);scene.add(m);return m}
mesh(new T.PlaneGeometry(160,160),0x64834b,0,0,0).rotation.x=-Math.PI/2;
let seed=27;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<100;i++){let x=(rnd()-.5)*145,z=(rnd()-.5)*145;if(Math.hypot(x,z)<8)continue;mesh(new T.CylinderGeometry(.24,.4,2.8,7),0x795238,x,1.4,z);mesh(new T.ConeGeometry(1.7,4.4,7),0x294d37,x,4,z)}
for(let i=0;i<20;i++){let x=(rnd()-.5)*130,z=(rnd()-.5)*130;mesh(new T.DodecahedronGeometry(.8+rnd()*1.5),0x858987,x,.7,z)}
const player=new T.Group();scene.add(player);const body=new T.Mesh(new T.CapsuleGeometry(.45,1,4,8),new T.MeshStandardMaterial({color:0x3767a0}));body.position.y=1;player.add(body);const head=new T.Mesh(new T.SphereGeometry(.35,12,8),new T.MeshStandardMaterial({color:0xe5bd91}));head.position.y=2;player.add(head);const sword=new T.Mesh(new T.BoxGeometry(.13,1.4,.16),new T.MeshStandardMaterial({color:0xc9d8e4}));sword.position.set(.65,1.2,.1);player.add(sword);
const enemies=[],coins=[];let hp=100,gold=0,kills=0,cool=0,dead=false,flash=0;const keys=new Set();const stats=document.querySelector('#stats'),bar=document.querySelector('#bar'),quest=document.querySelector('#quest'),msg=document.querySelector('#msg');
function spawn(){for(let i=0;i<12;i++){let a=i*2.4,r=12+rnd()*32;let m=mesh(new T.DodecahedronGeometry(.85),0x9a3438,Math.cos(a)*r,.85,Math.sin(a)*r);enemies.push({m,hp:50,cd:0})}}spawn();
function attack(){if(dead||cool>0)return;cool=.45;flash=.2;let best=null,dist=3.1;for(const e of enemies){let d=e.m.position.distanceTo(player.position);if(d<dist){best=e;dist=d}}if(best){best.hp-=25;msg.textContent='Zarba!';if(best.hp<=0){const p=best.m.position;coins.push(mesh(new T.CylinderGeometry(.3,.3,.13,12),0xffc52b,p.x,.4,p.z));scene.remove(best.m);best.m.geometry.dispose();best.m.material.dispose();enemies.splice(enemies.indexOf(best),1);kills++;msg.textContent=kills===5?'Topshiriq bajarildi! +50 oltin':'Maxluq yengildi!';if(kills===5)gold+=50}}else msg.textContent='Maxluqqa yaqinlashing.'}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys.add(k);if(k===' ')attack()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
for(const b of document.querySelectorAll('[data-key]')){b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.key)}
document.querySelector('#attack').onpointerdown=attack;document.querySelector('#reset').onclick=()=>location.reload();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new T.Clock();renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);cool=Math.max(0,cool-dt);flash=Math.max(0,flash-dt);sword.rotation.z=flash>0?-1.5:0;
if(!dead){let x=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),z=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));if(x||z){let n=Math.hypot(x,z);player.position.x=T.MathUtils.clamp(player.position.x+x/n*7*dt,-72,72);player.position.z=T.MathUtils.clamp(player.position.z+z/n*7*dt,-72,72);player.rotation.y=Math.atan2(x,z)}
for(const e of enemies){let dx=player.position.x-e.m.position.x,dz=player.position.z-e.m.position.z,d=Math.hypot(dx,dz);e.cd-=dt;if(d<10&&d>1.4){e.m.position.x+=dx/d*2.1*dt;e.m.position.z+=dz/d*2.1*dt}if(d<1.8&&e.cd<=0){hp=Math.max(0,hp-8);e.cd=1.2;if(!hp){dead=true;msg.textContent='Mag‘lub bo‘ldingiz. Qayta boshlang.'}}}
for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.rotation.y+=dt*3;if(c.position.distanceTo(player.position)<1.5){gold+=10;scene.remove(c);c.geometry.dispose();c.material.dispose();coins.splice(i,1)}}}
camera.position.lerp(new T.Vector3(player.position.x,player.position.y+11,player.position.z+15),1-Math.exp(-dt*8));camera.lookAt(player.position.x,1,player.position.z);stats.textContent='HP '+hp+' / 100 · Oltin '+gold+' · Daraja '+(1+Math.floor(kills/5));bar.style.width=hp+'%';quest.textContent='Topshiriq: '+Math.min(kills,5)+'/5';renderer.render(scene,camera)});
}catch(e){const el=document.querySelector('#error');el.style.display='grid';el.textContent='3D o‘yin yuklanmadi. Internet va WebGL sozlamalarini tekshiring, so‘ng sahifani yangilang.';console.error(e)}
</script></body></html>
