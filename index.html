const clock=new T.Clock();renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);cool=Math.max(0,cool-dt);comboTime=Math.max(0,comboTime-dt);dodgeTime=Math.max(0,dodgeTime-dt);mana=Math.min(100,mana+dt*4);stamina=T.MathUtils.clamp(stamina+dt*(guard?-10:12),0,100);if(stamina<=0)guard=false;document.querySelector("#resources").textContent="Mana "+Math.floor(mana)+" / 100 · Stamina "+Math.floor(stamina)+" / 100"+(guard?" · Qalqon":"");for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.t-=dt;e.m.material.opacity=Math.max(0,e.t*2);e.m.scale.multiplyScalar(1+dt);if(e.t<=0){scene.remove(e.m);e.m.geometry.dispose();e.m.material.dispose();effects.splice(i,1)}}healCd=Math.max(0,healCd-dt);document.querySelector("#heal").textContent=healCd>0?"Shifo "+Math.ceil(healCd)+"s":"3 · Shifo";flash=Math.max(0,flash-dt);sword.rotation.z=flash>0?-1.5:0;aura.intensity=flash>0?14:4;ring.material.opacity=.3+.15*Math.sin(clock.elapsedTime*3);document.querySelector("#rank").textContent="HUNTER · "+["E","D","C","B","A","S"][Math.min(5,Math.floor(kills/5))]+" RANK";
if(!dead&&dialog.style.display!=="block"){let oldX=player.position.x,oldZ=player.position.z;if(jumpV||player.position.y>0){jumpV-=dt*18;player.position.y=Math.max(0,player.position.y+jumpV*dt);if(player.position.y===0)jumpV=0}let x=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),z=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));for(let i=0;i<playerLimbs.length;i++)playerLimbs[i].rotation.x=(x||z)?Math.sin(clock.elapsedTime*10+i*Math.PI/2)*.45:0;if(dodgeTime>0&&!x&&!z){x=Math.sin(player.rotation.y);z=Math.cos(player.rotation.y)}if(x||z){let n=Math.hypot(x,z);player.position.x=T.MathUtils.clamp(player.position.x+x/n*(dodgeTime>0?19:guard?3:7)*dt,-72,72);player.position.z=T.MathUtils.clamp(player.position.z+z/n*(dodgeTime>0?19:guard?3:7)*dt,-72,72);player.rotation.y=Math.atan2(x,z)}
if(obstacles.some(o=>Math.abs(player.position.x-o.x)<o.w+.35&&Math.abs(player.position.z-o.z)<o.d+.35)){player.position.x=oldX;player.position.z=oldZ}for(const e of enemies){let dx=player.position.x-e.m.position.x,dz=player.position.z-e.m.position.z,d=Math.hypot(dx,dz);e.cd-=dt;e.m.rotation.y=Math.atan2(dx,dz);for(let i=0;i<e.limbs.length;i++)e.limbs[i].rotation.x=d<10&&d>1.4?Math.sin(clock.elapsedTime*8+i*Math.PI/2)*.4:0;if(d<10&&d>1.4){e.m.position.x+=dx/d*2.1*dt;e.m.position.z+=dz/d*2.1*dt}if(d<1.8&&e.cd<=0){hp=Math.max(0,hp-(dodgeTime>0?0:guard?2:e.boss?18:8));e.cd=1.2;if(!hp){dead=true;msg.textContent='Mag‘lub bo‘ldingiz. Qayta boshlang.'}}}
for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.rotation.y+=dt*3;if(c.position.distanceTo(player.position)<1.5){gold+=10;scene.remove(c);c.geometry.dispose();c.material.dispose();coins.splice(i,1)}}}
near=towns.find(t=>t.actor.position.distanceTo(player.position)<4)||null;talk.style.display=near&&!dead?'block':'none';let region=player.position.z>20?towns[2]:player.position.x<0?towns[0]:towns[1];document.querySelector('#region').textContent=region.country+(Math.hypot(player.position.x-region.x,player.position.z-region.z)<16?' · '+region.name:' · Yovvoyi hudud');if(enemies.length===0){respawnTimer+=dt;if(respawnTimer>8){spawn();respawnTimer=0}}let target=enemies.filter(e=>e.m.position.distanceTo(player.position)<10).sort((a,b)=>a.m.position.distanceTo(player.position)-b.m.position.distanceTo(player.position))[0];const te=document.querySelector("#target");te.style.display=target?"block":"none";if(target)te.textContent=(target.boss?"BOSS · Ork sardori":"Ork")+" · HP "+target.hp+"/"+(target.boss?250:50);sun.position.set(player.position.x+20,35,player.position.z+10);sun.target.position.copy(player.position);scene.add(sun.target);camera.position.lerp(new T.Vector3(player.position.x,player.position.y+3.8,player.position.z+6.8),1-Math.exp(-dt*8));camera.lookAt(player.position.x,1,player.position.z);stats.textContent='HP '+hp+' / 100 · Oltin '+gold+' · Daraja '+(1+Math.floor(kills/5));bar.style.width=hp+'%';quest.textContent=towns.filter(t=>t.state===1).map(t=>t.name+': '+Math.min(t.goal,kills-t.start)+'/'+t.goal).join(' | ')||'NPC bilan suhbatlashing';for(let i=animatedActors.length-1;i>=0;i--){const a=animatedActors[i];if(!a.actor.parent){a.mixer.stopAllAction();animatedActors.splice(i,1);continue}const moving=a.last.distanceToSquared(a.actor.position)>.00001;const next=moving?a.b:a.a;if(next&&next!==a.current){if(a.current)a.current.fadeOut(.15);next.reset().fadeIn(.15).play();a.current=next}a.last.copy(a.actor.position);a.mixer.update(dt)}renderer.render(scene,camera)});
}catch(e){const el=document.querySelector('#error');el.style.display='grid';el.textContent='3D o‘yin yuklanmadi. Internet va WebGL sozlamalarini tekshiring, so‘ng sahifani yangilang.';console.error(e)}
